name: dbt CI/CD
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  dbt_test:
    name: Run dbt Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dbt
        run: pip install dbt-core dbt-fabric sqlfluff

      - name: Install Microsoft ODBC
        run: sudo ACCEPT_EULA=Y apt-get install msodbcsql18 -y

      - name: Install dbt dependencies
        run: dbt deps

      - name: Run lint check on snapshots
        run: sqlfluff lint snapshots --dialect tsql

      - name: Run lint check on models
        run: sqlfluff lint models --dialect tsql

      - name: Execute dbt Tests
        run: dbt test --profiles-dir ./
        env:
          DBT_FABRIC_SERVER: ${{ secrets.FABRIC_SERVER }}
          DBT_FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          DBT_FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          DBT_FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}

  dbt_build:
    name: Build and Deploy dbt Models
    runs-on: ubuntu-latest
    needs: dbt_test # This job runs only if dbt_test passes.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dbt
        run: pip install dbt-core dbt-fabric sqlfluff

      - name: Install Microsoft ODBC
        run: sudo ACCEPT_EULA=Y apt-get install msodbcsql18 -y

      - name: Install dbt dependencies
        run: dbt deps

      - name: run DBT build slim mode
        run: dbt build --fail-fast --defer --state prod-manifest/ --profiles-dir ./
        #run: dbt build --fail-fast --defer --state prod-manifest/ --select state:modified+ --empty --profiles-dir ./

        env:
          DBT_PROFILES_DIR: .
          DBT_FABRIC_SERVER: ${{ secrets.FABRIC_SERVER }}
          DBT_FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          DBT_FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          DBT_FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}

      - name: Deploy dbt Models to Fabric
        if: github.event_name == 'push'
        run: dbt run --target prod
        env:
          DBT_FABRIC_SERVER: ${{ secrets.FABRIC_SERVER }}
          DBT_FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          DBT_FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          DBT_FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
